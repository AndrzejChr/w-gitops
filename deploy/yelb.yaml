apiVersion: v1
kind: Service
metadata: {name: redis-server, labels: {app: redis-server, tier: cache}}
spec:
  ports: [{port: 6379}]
  selector: {app: redis-server, tier: cache}
---
apiVersion: v1
kind: Service
metadata: {name: yelb-db, labels: {app: yelb-db, tier: backenddb}}
spec:
  ports: [{port: 5432}]
  selector: {app: yelb-db, tier: backenddb}
---
apiVersion: v1
kind: Service
metadata: {name: yelb-appserver, labels: {app: yelb-appserver, tier: middletier}}
spec:
  ports: [{port: 4567}]
  selector: {app: yelb-appserver, tier: middletier}
---
apiVersion: v1
kind: Service
metadata: {name: yelb-ui, labels: {app: yelb-ui, tier: frontend}}
spec:
  ports: [{port: 80, targetPort: 80}]
  selector: {app: yelb-ui, tier: frontend}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: yelb-db-data}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: wld1c1-vsan-storage-policy
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: yelb-db}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: yelb-db, tier: backenddb}}
  template:
    metadata: {labels: {app: yelb-db, tier: backenddb}}
    spec:
      imagePullSecrets: [{name: harbor-pull}]
      containers:
        - name: yelb-db
          image: harbor.vcf.atd.lab/w-apps/yelb-db:0.6
          ports: [{containerPort: 5432}]
          env: [{name: PGDATA, value: /var/lib/postgresql/data/pgdata}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: yelb-db-data}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis-server}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis-server, tier: cache}}
  template:
    metadata: {labels: {app: redis-server, tier: cache}}
    spec:
      imagePullSecrets: [{name: harbor-pull}]
      containers:
        - name: redis-server
          image: harbor.vcf.atd.lab/w-apps/redis:4.0.2
          ports: [{containerPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: yelb-appserver}
spec:
  replicas: 2
  selector: {matchLabels: {app: yelb-appserver, tier: middletier}}
  template:
    metadata: {labels: {app: yelb-appserver, tier: middletier}}
    spec:
      imagePullSecrets: [{name: harbor-pull}]
      containers:
        - name: yelb-appserver
          image: harbor.vcf.atd.lab/w-apps/yelb-appserver:0.7
          ports: [{containerPort: 4567}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: yelb-ui}
spec:
  replicas: 3
  selector: {matchLabels: {app: yelb-ui, tier: frontend}}
  template:
    metadata: {labels: {app: yelb-ui, tier: frontend}}
    spec:
      imagePullSecrets: [{name: harbor-pull}]
      containers:
        - name: yelb-ui
          image: harbor.vcf.atd.lab/w-apps/yelb-ui:0.10
          ports: [{containerPort: 80}]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: yelb-tls}
spec:
  secretName: yelb-tls
  dnsNames: [yelb-gitops.vcf.atd.lab]
  issuerRef: {kind: ClusterIssuer, name: w-ca-issuer}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata: {name: yelb}
spec:
  virtualhost:
    fqdn: yelb-gitops.vcf.atd.lab
    tls: {secretName: yelb-tls}
  routes:
    - services: [{name: yelb-ui, port: 80}]
